messages:
  gene_upload:
    systematic_identifier_desc: UniProt identifier
    primary_name_desc: ~
    examples:
      gene_identifier: 'Q00909'
      gene_name: ~

email_signature: "Kim Hammond-Kosack and the PHI-base team"

curs_config:
  gene_page_top_message: >
    <p><b>Note:</b> PHI-Canto groups UniProt identifiers by their nearest corresponding NCBI Taxonomy identifier (at the rank of species), so the organism name may not match what is shown in UniProt. Please use the 'experimental strains' field to specify lower taxonomic ranks (such as strains, subspecies, and pathovars).</p>
    <p><b>Note:</b> Do not add species here if their only use is as a delivery mechanism. Information about delivery mechanisms should be added later, as an experimental condition.</p>
  experimental_conditions_help_text: >
    Please add experimental conditions (including delivery mechanism). Conditions are the aspects of the experimental setup that are independent of what cells (strain, genotype, constructs, etc.) are used.
  finish_form:
    extra_text_gene_information: >
      <p>
        Examples include:
        <ul>
        <li> protein domain data or other protein sequence features
        <li> missing gene names (synonyms)
        <li> transcriptional regulation (of the wild-type allele - transcriptional changes due to mutations can be captured in Canto)
        <li> complementation data (whether the gene complements a homologue in a different organism or vice versa; complementation may be full, partial or absent)
        <li> gene product name updates
        </ul>
        Most of these annotation types will be handled in future releases of the
        curation tool.
      </p>

