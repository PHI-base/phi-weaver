# Reorganisation config for the phi-weaver vault
# Use with: python obsidian_reorganise.py --config reorganise-config-OBS-PHI-Canto.yaml
#
# IMPORTANT: the phi-weaver vault must be the active vault in Obsidian for --execute to work.
# Verify with: /mnt/c/Windows/System32/cmd.exe /c 'D:\ObsidianProgram\Obsidian.exe vault list'

vault_path: /mnt/z/phi-weaver
target_folder: 00-Inbox
obsidian_cli: 'D:\ObsidianProgram\Obsidian.exe'
extensions: [".md", ".canvas"]

scratch_patterns:
  - Untitled
  - test
  - new note

scratch_exact:
  - "#.md"

# Rules — organized by workflow-specific folders
rules:

  - folder: 00-Inbox/To-curate/
    keywords:
      - curation
      - curate
      - PHI-Canto
      - annotation
      - to curate

  - folder: 04-Literature/
    keywords:
      - review
      - paper
      - publication
      - journal
      - literature
      - reference

  - folder: 05-Protocols/
    keywords:
      - protocol
      - SOP
      - how to
      - How to
      - complementation
      - transformation
      - method
      - procedure

  - folder: 06-Training/
    keywords:
      - training
      - tutorial
      - course
      - guide
      - onboarding
      - education

  - folder: 07-Standards/
    keywords:
      - nomenclature
      - ontology
      - standard
      - vocabulary
      - genetic
      - GO term
